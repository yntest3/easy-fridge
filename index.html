<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Fridge</title>
<style>
:root{--bg:#FFF8EC;--brown:#6b3f12;--soft:#8a5a2b;--line:#f4c98a;--line2:#fbe6c6;--or:#D9560F;--or2:#FF8A3D;--yel:#FFD25E;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--brown);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
header{background:linear-gradient(135deg,var(--yel),var(--or2));padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;color:#4a2a08}
.lang{display:flex;background:#fff8;border-radius:20px;padding:3px}
.lang button{border:0;background:transparent;padding:6px 12px;border-radius:16px;font-weight:700;font-size:14px;color:#4a2a08}
.lang button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #0003}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:20px}
@media(min-width:820px){main{grid-template-columns:420px 1fr;align-items:start}.right{position:static}}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
.sub{margin:0 0 12px;color:var(--soft);font-size:14px}
.stage{perspective:1400px}
.fridge{position:relative;background:#fff;border:4px solid var(--line);border-radius:22px;overflow:hidden;min-height:430px;box-shadow:0 6px 18px #d9a05c44}
.inside{padding:6px 10px;background:linear-gradient(#fffdf6,#fff4dc)}
.fridge.closed .inside{visibility:hidden}
.shelf{border-bottom:5px solid var(--line2);padding:8px 2px 10px}
.shelf:last-child{border-bottom:0}
.shelf h3{margin:0 0 6px;font-size:12px;color:var(--soft);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #d9b98a;background:#fff;border-radius:20px;padding:7px 11px;font-size:14px;display:flex;gap:4px;align-items:center;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--yel);border-color:var(--or);font-weight:700;box-shadow:0 2px 0 var(--or)}
.chip .em{font-size:20px}
.door{position:absolute;inset:0;border:0;border-radius:0;background:linear-gradient(135deg,#ffe9b8,#ffc77d);transform-origin:left center;transition:transform .8s cubic-bezier(.3,.7,.3,1),opacity .5s .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:18px;color:#4a2a08}
.door .big{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.door .handle{position:absolute;right:16px;top:30%;width:12px;height:90px;border-radius:8px;background:#fff9}
.door .hint{background:var(--or);color:#fff;padding:9px 20px;border-radius:30px;font-size:15px}
.fridge:not(.closed) .door{transform:rotateY(-110deg);opacity:0;pointer-events:none;visibility:hidden;transition:transform .8s cubic-bezier(.3,.7,.3,1),opacity .5s .3s,visibility 0s 1s}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.btn{border:2px solid var(--line);background:#fff;border-radius:24px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--line2)}
.cta{width:100%;border:0;background:var(--or);color:#fff;font-weight:800;font-size:17px;padding:14px;border-radius:32px;box-shadow:0 4px 0 #a23f08}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #a23f08}
.cta:disabled{opacity:.55;cursor:not-allowed}
.count{font-size:14px;color:var(--soft);margin-left:auto}
.note{font-size:12px;color:var(--soft);margin:8px 2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tog{border:2px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700}
.tog[aria-pressed=true]{background:var(--or2);border-color:var(--or);color:#3a1d00}
.empty{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:26px 16px;text-align:center;color:var(--soft)}
.empty .em{font-size:44px;display:block}
.card{width:100%;text-align:left;background:var(--card);border:2px solid var(--line2);border-radius:18px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 6px #d9a05c26;animation:pop .35s both}
.card:hover{border-color:var(--or2)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card .e{font-size:38px}
.card .t{font-weight:800;font-size:16px}
.meta{font-size:13px;color:var(--soft);margin-top:3px}
.stars{color:#e08a00;letter-spacing:1px;font-size:15px}
.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px;vertical-align:middle;background:var(--or);color:#fff}
.tag.miss{background:#fff1d6;color:#7a4a00;border:1px solid var(--line)}
.fav{margin-left:auto;font-size:20px}
.grp{font-size:14px;font-weight:800;margin:14px 0 8px;color:var(--soft)}
#overlay{position:fixed;inset:0;background:#3a1d0088;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
#overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 24px;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){#overlay{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font-size:21px;margin:0}
.sheet .row{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ing{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ing span{background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px}
.ing span.no{background:#fff1d6;border-style:dashed}
ol.steps{list-style:none;padding:0;margin:10px 0;counter-reset:s}
ol.steps li{counter-increment:s;background:#fff;border-radius:14px;padding:10px 12px 10px 46px;margin-bottom:8px;position:relative;border:2px solid var(--line2);cursor:pointer;text-align:left;width:100%;display:block}
ol.steps li::before{content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--yel);font-weight:800;text-align:center;line-height:26px}
ol.steps li.done{opacity:.55;text-decoration:line-through}
ol.steps li.done::before{content:"✓";background:#8bc34a}
.msg{min-height:22px;font-size:14px;color:#8a3a00;font-weight:700;margin-top:6px}
footer{text-align:center;font-size:12px;color:var(--soft);padding:10px 16px 28px}
</style>
</head>
<body>
<header>
  <div class="logo"><span aria-hidden="true">🧊</span><span>Easy Fridge</span></div>
  <div class="lang" role="group" data-demo="lang-switch" data-i18n-aria="langLabel">
    <button type="button" id="l-ja" data-demo="lang-ja" aria-pressed="false">日本語</button>
    <button type="button" id="l-en" data-demo="lang-en" aria-pressed="false">EN</button>
  </div>
</header>
<main>
  <section class="left">
    <h1 data-i18n="h1"></h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="stage">
      <div class="fridge closed" id="fridge" data-demo="fridge">
        <div class="inside" id="shelves"></div>
        <button type="button" class="door" id="door" data-demo="open-fridge" data-i18n-aria="openAria">
          <span class="handle"></span><span class="big" aria-hidden="true">🧊</span>
          <span data-i18n="doorTitle"></span><span class="hint" data-i18n="doorHint"></span>
        </button>
      </div>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="sample" data-demo="sample-set" data-i18n="sample"></button>
      <button type="button" class="btn" id="clear" data-demo="clear" data-i18n="clear"></button>
      <button type="button" class="btn" id="close" data-demo="close-door" data-i18n="closeDoor"></button>
      <span class="count" id="count" data-demo="count" aria-live="polite"></span>
    </div>
    <button type="button" class="cta" id="find" data-demo="find-recipes" data-i18n="find"></button>
    <div class="msg" id="msg" role="status"></div>
    <p class="note" data-i18n="staples"></p>
  </section>
  <section class="right">
    <h2 data-i18n="resTitle"></h2>
    <div class="filters">
      <button type="button" class="tog" id="fEasy" data-demo="filter-easy" aria-pressed="false" data-i18n="fEasy"></button>
      <button type="button" class="tog" id="fQuick" data-demo="filter-quick" aria-pressed="false" data-i18n="fQuick"></button>
      <button type="button" class="tog" id="fFav" data-demo="filter-fav" aria-pressed="false" data-i18n="fFav"></button>
    </div>
    <div id="results" data-demo="results" aria-live="polite"></div>
  </section>
</main>
<footer data-i18n="foot"></footer>

<div id="overlay" role="dialog" aria-modal="true" data-demo="recipe-dialog">
  <div class="sheet" id="sheet"></div>
</div>

}catch(e){}
const $=id=>document.getElementById(id);
const st={sel:new Set(),searched:false,easy:false,quick:false,favOnly:false,fav:new Set(),detail:null,done:new Set()};
try{const f=JSON.parse(localStorage.getItem("ef_fav")||"[]");if(Array.isArray(f))f.forEach(x=>st.fav.add(x))}catch(e){}
function saveFav(){try{localStorage.setItem("ef_fav",JSON.stringify([...st.fav]))}catch(e){}}
const D=()=>I18N[lang];
function t(k,v){let s=D()[k];if(s===undefined)return k;if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s}
function stars(n){return "★".repeat(n)+"☆".repeat(3-n)}

function applyLang(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria))});
  $("l-ja").setAttribute("aria-pressed",lang==="ja");$("l-en").setAttribute("aria-pressed",lang==="en");
  renderShelves();renderCount();renderResults();if(st.detail)renderDetail();
}
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}applyLang()}

function renderShelves(){
  const box=$("shelves");box.innerHTML="";
  D().shelf.forEach((name,i)=>{
    const sh=document.createElement("div");sh.className="shelf";
    sh.innerHTML='<h3></h3><div class="chips"></div>';sh.querySelector("h3").textContent=name;
    const c=sh.querySelector(".chips");
    ING.filter(g=>g.sh===i).forEach(g=>{
      const b=document.createElement("button");b.type="button";b.className="chip";
      b.dataset.demo="ing-"+g.id;b.setAttribute("aria-pressed",st.sel.has(g.id));
      b.innerHTML='<span class="em" aria-hidden="true">'+g.e+'</span><span></span>';
      b.lastChild.textContent=D().ing[g.id];
      b.onclick=()=>{st.sel.has(g.id)?st.sel.delete(g.id):st.sel.add(g.id);b.setAttribute("aria-pressed",st.sel.has(g.id));renderCount();$("msg").textContent="";if(st.searched)renderResults()};
      c.appendChild(b);
    });
    box.appendChild(sh);
  });
}
function renderCount(){$("count").textContent=t("count",{n:st.sel.size})}

function card(x,fastestId){
  const r=x.r,d=D().rec[r.id];
  const b=document.createElement("button");b.type="button";b.className="card";b.dataset.demo="recipe-"+r.id;
  const tag=x.miss.length?'<span class="tag miss"></span>':(r.id===fastestId?'<span class="tag"></span>':"");
  b.innerHTML='<div class="e" aria-hidden="true">'+r.e+'</div><div style="flex:1;min-width:0"><div class="t"></div><div class="meta"><span class="stars"></span> ・ <span class="mn"></span> ・ <span class="tl"></span></div><div class="meta lv"></div></div><span class="fav" aria-hidden="true"></span>';
  const tt=b.querySelector(".t");tt.textContent=d.n;
  if(tag){tt.insertAdjacentHTML("beforeend",tag);const g=tt.querySelector(".tag");g.textContent=x.miss.length?t("need",{x:x.miss.map(i=>D().ing[i]).join(", ")}):t("fastest")}
  b.querySelector(".stars").textContent=stars(r.st);
  b.querySelector(".mn").textContent=t("min",{n:r.min});
  b.querySelector(".tl").textContent=D().tool[r.tool];
  b.querySelector(".lv").textContent=D().easy[r.st-1];
  b.querySelector(".fav").textContent=st.fav.has(r.id)?"♥":"";
  b.onclick=()=>openDetail(r.id);
  return b;
}
function renderResults(){
  const box=$("results");box.innerHTML="";
  let list=[];
  if(st.favOnly){
    list=REC.filter(r=>st.fav.has(r.id)).map(r=>({r,miss:r.req.filter(i=>!st.sel.has(i))}));
  }else if(st.searched){
    list=REC.map(r=>({r,miss:r.req.filter(i=>!st.sel.has(i))})).filter(x=>x.miss.length<=1&&x.miss.length<x.r.req.length);
  }else{box.innerHTML='<div class="empty"><span class="em">🧊</span><div>'+t("emptyStart")+'</div></div>';return}
  if(st.easy)list=list.filter(x=>x.r.st===1);
  if(st.quick)list=list.filter(x=>x.r.min<=10);
  list.sort((a,b)=>a.miss.length-b.miss.length||a.r.st-b.r.st||a.r.min-b.r.min);
  if(!list.length){box.innerHTML='<div class="empty"><span class="em">🍽️</span><div>'+(st.favOnly?t("emptyFav"):t("emptyNone"))+'</div></div>';return}
  const can=list.filter(x=>!x.miss.length),alm=list.filter(x=>x.miss.length);
  const fastest=can.length?can.slice().sort((a,b)=>a.r.min-b.r.min)[0].r.id:null;
  if(can.length){const h=document.createElement("div");h.className="grp";h.textContent="✅ "+t("can")+" ("+can.length+")";box.appendChild(h);can.forEach(x=>box.appendChild(card(x,fastest)))}
  if(alm.length){const h=document.createElement("div");h.className="grp";h.textContent="🛒 "+t("almost")+" ("+alm.length+")";box.appendChild(h);alm.forEach(x=>box.appendChild(card(x,null)))}
}

function openDetail(id){st.detail=id;st.done=new Set();renderDetail();$("overlay").classList.add("show");setTimeout(()=>{const c=$("sheet").querySelector(".closeBtn");c&&c.focus()},30)}
function closeDetail(){st.detail=null;$("overlay").classList.remove("show");renderResults()}
function renderDetail(){
  const r=REC.find(x=>x.id===st.detail),d=D().rec[r.id],sh=$("sheet");
  sh.innerHTML='<div class="row"><div><div style="font-size:44px" aria-hidden="true"></div><h2></h2><div class="meta"><span class="stars"></span> ・ <span class="mn"></span> ・ <span class="tl"></span> ・ <span class="lv"></span></div></div><button type="button" class="btn closeBtn" data-demo="dialog-close"></button></div><h2 style="font-size:15px;margin-top:14px"></h2><div class="ing"></div><h2 style="font-size:15px"></h2><ol class="steps"></ol><button type="button" class="btn favBtn" data-demo="toggle-fav"></button>';
  sh.querySelector("div div").textContent=r.e;
  sh.querySelector("h2").textContent=d.n;
  sh.querySelector(".stars").textContent=stars(r.st);
  sh.querySelector(".mn").textContent=t("min",{n:r.min});
  sh.querySelector(".tl").textContent=D().tool[r.tool];
  sh.querySelector(".lv").textContent=D().easy[r.st-1];
  const hs=sh.querySelectorAll("h2");hs[1].textContent=t("detailIng");hs[2].textContent=t("detailSteps");
  const ing=sh.querySelector(".ing");
  r.req.forEach(i=>{const s=document.createElement("span");const g=ING.find(x=>x.id===i);const have=st.sel.has(i);s.textContent=(have?"✓ ":"＋ ")+g.e+" "+D().ing[i];if(!have)s.className="no";ing.appendChild(s)});
  const ol=sh.querySelector(".steps");
  d.s.forEach((x,i)=>{const li=document.createElement("li");li.textContent=x;li.tabIndex=0;li.setAttribute("role","checkbox");li.dataset.demo="step-"+(i+1);
    const on=st.done.has(i);li.setAttribute("aria-checked",on);if(on)li.classList.add("done");
    const tog=()=>{st.done.has(i)?st.done.delete(i):st.done.add(i);renderDetail();const n=$("sheet").querySelectorAll(".steps li")[i];n&&n.focus()};
    li.onclick=tog;li.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tog()}};ol.appendChild(li)});
  const cb=sh.querySelector(".closeBtn");cb.textContent=t("close");cb.onclick=closeDetail;
  const fb=sh.querySelector(".favBtn");fb.textContent=st.fav.has(r.id)?t("favOn"):t("favOff");
  fb.onclick=()=>{st.fav.has(r.id)?st.fav.delete(r.id):st.fav.add(r.id);saveFav();renderDetail();sh.querySelector(".favBtn").focus()};
}

function setDoor(open){$("fridge").classList.toggle("closed",!open)}
$("door").onclick=()=>setDoor(true);
$("close").onclick=()=>setDoor(false);
$("clear").onclick=()=>{st.sel.clear();st.searched=false;$("msg").textContent="";renderShelves();renderCount();renderResults()};
$("sample").onclick=()=>{setDoor(true);st.sel=new Set(["egg","onion","rice","bacon","tomato","cheese"]);renderShelves();renderCount();$("msg").textContent=""};
$("find").onclick=()=>{
  if(!st.sel.size){$("msg").textContent=t("hintPick");return}
  st.searched=true;st.favOnly=false;$("fFav").setAttribute("aria-pressed","false");
  renderResults();
  const n=REC.filter(r=>r.req.every(i=>st.sel.has(i))).length;
  $("msg").textContent=n?t("found",{n}):t("foundAlmost");
  if(window.innerWidth<820)$("results").scrollIntoView({behavior:"smooth",block:"start"});
};
$("fEasy").onclick=e=>{st.easy=!st.easy;e.currentTarget.setAttribute("aria-pressed",st.easy);renderResults()};
$("fQuick").onclick=e=>{st.quick=!st.quick;e.currentTarget.setAttribute("aria-pressed",st.quick);renderResults()};
$("fFav").onclick=e=>{st.favOnly=!st.favOnly;e.currentTarget.setAttribute("aria-pressed",st.favOnly);renderResults()};
$("l-ja").onclick=()=>setLang("ja");$("l-en").onclick=()=>setLang("en");
$("overlay").onclick=e=>{if(e.target===$("overlay"))closeDetail()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&st.detail)closeDetail()});
applyLang();
</script>
</body>
</html>
